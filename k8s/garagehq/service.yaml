apiVersion: v1
kind: Service
metadata:
  name: garagehq-api
  namespace: garagehq
  labels:
    app: garagehq
spec:
  type: NodePort
  selector:
    app: garagehq
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
      nodePort: 30033
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: garagehq-admin
  namespace: garagehq
  labels:
    app: garagehq
spec:
  type: NodePort
  selector:
    app: garagehq
  ports:
    - name: admin
      port: 3903
      targetPort: 3903
      nodePort: 30031
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: garagehq-web
  namespace: garagehq
  labels:
    app: garagehq
spec:
  type: ClusterIP
  selector:
    app: garagehq
  ports:
    - name: web
      port: 3902
      targetPort: 3902
      protocol: TCP
