apiVersion: apps/v1
kind: Deployment
metadata:
  name: garagehq
  namespace: garagehq
  labels:
    app: garagehq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garagehq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: garagehq
    spec:
      initContainers:
        - name: init-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /etc/garage-secrets/rpc_secret /etc/garage/rpc_secret
              cp /etc/garage-secrets/admin_token /etc/garage/admin_token
              cp /etc/garage-secrets/metrics_token /etc/garage/metrics_token
              chmod 400 /etc/garage/*
          volumeMounts:
            - name: secrets
              mountPath: /etc/garage-secrets
              readOnly: true
            - name: garage-config-dir
              mountPath: /etc/garage
      containers:
        - name: garagehq
          image: dxflrs/garage:v1.1.0
          args:
            - server
          ports:
            - name: s3-api
              containerPort: 3900
              protocol: TCP
            - name: rpc
              containerPort: 3901
              protocol: TCP
            - name: web
              containerPort: 3902
              protocol: TCP
            - name: admin
              containerPort: 3903
              protocol: TCP
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
          volumeMounts:
            - name: config
              mountPath: /etc/garage/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: garage-config-dir
              mountPath: /etc/garage/rpc_secret
              subPath: rpc_secret
              readOnly: true
            - name: garage-config-dir
              mountPath: /etc/garage/admin_token
              subPath: admin_token
              readOnly: true
            - name: garage-config-dir
              mountPath: /etc/garage/metrics_token
              subPath: metrics_token
              readOnly: true
            - name: meta-storage
              mountPath: /var/lib/garage/meta
            - name: data-storage
              mountPath: /var/lib/garage/data
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: config
          configMap:
            name: garagehq-config
        - name: secrets
          secret:
            secretName: garagehq-secrets
        - name: garage-config-dir
          emptyDir: {}
        - name: meta-storage
          persistentVolumeClaim:
            claimName: garagehq-meta-pvc
        - name: data-storage
          persistentVolumeClaim:
            claimName: garagehq-data-pvc
