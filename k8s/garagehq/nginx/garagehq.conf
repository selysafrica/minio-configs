upstream garagehq_api {
    server 127.0.0.1:30033;
}

upstream garagehq_admin {
    server 127.0.0.1:30031;
}

# GarageHQ S3 API (port 30033)
server {
    listen 80;
    server_name garage.selys.app;

    client_max_body_size 1000m;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://garagehq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}

# GarageHQ Admin Dashboard (port 30031)
server {
    listen 80;
    server_name console.garage.selys.app;

    client_max_body_size 100m;
    proxy_buffering off;

    location / {
        proxy_pass http://garagehq_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
