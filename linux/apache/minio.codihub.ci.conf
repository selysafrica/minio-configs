<VirtualHost *:80>
    ServerName minio.codihub.ci

    # Redirection vers HTTPS si SSL est configuré
    # Décommentez après avoir obtenu le certificat
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://localhost:9012/
    ProxyPassReverse / http://localhost:9012/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host "minio.codihub.ci"

    # WebSocket support pour la console MinIO
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://localhost:9012/$1 [P,L]

    ProxyTimeout 300
</VirtualHost>

# HTTPS (décommentez après AutoSSL / Let's Encrypt)
