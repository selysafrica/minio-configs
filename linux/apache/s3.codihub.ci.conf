<VirtualHost *:80>
    ServerName s3.codihub.ci

    # Redirection vers HTTPS si SSL est configuré
    # Décommentez après avoir obtenu le certificat
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://localhost:9011/
    ProxyPassReverse / http://localhost:9011/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host "s3.codihub.ci"

    ProxyTimeout 300
</VirtualHost>

# HTTPS (décommentez après AutoSSL / Let's Encrypt)
# <VirtualHost *:443>
#     ServerName s3.codihub.ci
#
#     SSLEngine on
#     SSLCertificateFile /var/cpanel/ssl/apache_tls/s3.codihub.ci/combined
#     SSLCertificateKeyFile /var/cpanel/ssl/apache_tls/s3.codihub.ci/combined
#
#     ProxyRequests Off
#     ProxyPreserveHost On
#
#     <Proxy *>
#         Require all granted
#     </Proxy>
