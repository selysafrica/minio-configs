version: '3.8'

services:
  minio_v2:
    image: minio/minio:latest
    container_name: minio_v2
    restart: unless-stopped
    command: server /data_v2 --console-address ":9001"
    ports:
      - "9011:9000"   # API S3 exposé sur le port 9011 de l'hôte
      - "9012:9001"   # Console Dashboard exposé sur le port 9012 de l'hôte
    volumes:
      - ./data_v2:/data_v2
      - ./certs_v2:/root/.minio/certs
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL}
      - MINIO_DOMAIN=${MINIO_DOMAIN}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL}
    networks:
      - minio-v2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

networks:
  minio-v2-network:
    driver: bridge
